# Docker Compose for Nazbeen Forex AI Asistance.
#
# Two profiles:
#   * default     — PostgreSQL + Redis only (native Django/Next.js on Windows).
#   * full stack  — `docker compose --profile app up -d` also builds/runs
#                   backend (gunicorn), celery worker and the Next.js frontend.
#
# The MT5 worker (mt5_worker/) and Windows integration cannot run in Docker —
# run those natively on Windows against the compose services if needed.
#
# REQUIRED: Docker Desktop for Windows with WSL2 backend and `docker compose` v2.
# NOTE: Docker was NOT available on the dev machine when these services were
# written — they are untested (see docs/PHASE_REPORTS/PHASE_10.md).
#
# The credentials below match the DATABASE_URL / REDIS_URL examples in
# `.env.example`. Variable interpolation reads your host `.env`.

name: nazbeen-forex-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: nazbeen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nazbeen
      POSTGRES_PASSWORD: nazbeen
      POSTGRES_DB: nazbeen_forex
      # EC2 / production settings run the Django job in UTC; keep the server in UTC too.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazbeen -d nazbeen_forex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nazbeen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Full stack (profile "app") ------------------------------------------
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nazbeen-backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: nazbeen_forex_ai.settings.production
      # Compose aborts if the variable is unset — production settings refuse
      # insecure defaults anyway (fail fast, ADR-005).
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in your .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      DATABASE_URL: postgres://nazbeen:nazbeen@postgres:5432/nazbeen_forex
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      USE_REDIS_CHANNELS: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Migrations run at start; replace with a release step for real deploys.
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run gunicorn nazbeen_forex_ai.wsgi:application
             --bind 0.0.0.0:8000 --workers 3 --timeout 60"

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nazbeen-worker
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: nazbeen_forex_ai.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in your .env}
      DATABASE_URL: postgres://nazbeen:nazbeen@postgres:5432/nazbeen_forex
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uv run celery -A nazbeen_forex_ai worker
      -Q default,heavy --loglevel=INFO --concurrency=2

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nazbeen-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data: