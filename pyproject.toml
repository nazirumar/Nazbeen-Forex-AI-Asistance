[project]
name = "nazbeen-forex-ai-asistance"
version = "0.1.0"
description = "AI-powered Forex market analysis and decision-support platform (analysis-only)."
readme = "README.md"
authors = [
    { name = "nazirumar", email = "nazirumar888@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django>=6.0",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16",
    "gunicorn>=26.2.0",
    # Windows-only: skipped on Linux so Docker images can build (Phase 10).
    "MetaTrader5; platform_system == 'Windows'",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "nazbeen_forex_ai.settings.test"
testpaths = ["nazbeen_forex_ai"]
pythonpath = ["."]
addopts = "-q"
